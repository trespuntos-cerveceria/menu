  :root{
    --navy:#0B1524;
    --navy-lift:#132238;
    --amber:#FFBB00;
    --cream:#FFF6CB;
    --hop:#0C6B3A;
    --ink:#0C0A06;
    --text:#FFFFFF;
    --text-dim:#AFC2D8;
    --display:"Pizarron",Impact,"Haettenschweiler","Arial Narrow",sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100vh;
    background:
      radial-gradient(120% 70% at 18% 0%, #1C4A55 0%, rgba(28,74,85,0) 58%),
      var(--navy);
    font-family:var(--body);
    color:var(--text);
    padding:16px 12px 40px;
    display:flex;
    justify-content:center;
  }

  .menu{
    width:100%;
    max-width:460px;
    background:var(--navy-lift);
    overflow:hidden;
  }

  /* ---------- Encabezado ---------- */
  .top{
    background:var(--amber);
    border-bottom:4px solid var(--ink);
    padding:22px 20px 18px;
    text-align:center;
    color:var(--ink);
  }
  .mark{
    width:104px;height:104px;
    border-radius:50%;
    border:4px solid var(--ink);
    display:block;margin:0 auto 12px;
  }
  .top h1{
    font-family:var(--display);
    font-size:2.6rem;
    font-weight:400;
    letter-spacing:.01em;
    line-height:.92;
    text-transform:uppercase;
  }
  .top p{
    margin-top:7px;
    font-size:.88rem;
    font-weight:700;
    color:#6B4E00;
  }

  /* ---------- Listado ---------- */
  .beer{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px 15px 0;
    border-bottom:1px solid rgba(255,255,255,.13);
  }
  .beer:last-child{border-bottom:0}

  /* la barra izquierda lleva el color real de la cerveza */
  .swatch{
    flex:0 0 15px;
    align-self:stretch;
    min-height:60px;
    border-right:2px solid rgba(255,255,255,.22);
  }

  .info{flex:1 1 auto;min-width:0}
  .name{
    font-family:var(--display);
    font-size:clamp(1.9rem,9vw,2.5rem);
    line-height:1;
    letter-spacing:.015em;
    text-transform:uppercase;
  }
  .style{
    margin-top:5px;
    font-size:.94rem;
    font-weight:600;
    color:var(--text-dim);
    line-height:1.25;
  }

  .abv{flex:0 0 auto;text-align:right}
  .abv b{
    font-family:var(--display);
    font-weight:400;
    font-size:1.7rem;
    line-height:1;
    letter-spacing:.01em;
  }
  .abv span{
    display:block;
    margin-top:4px;
    font-size:.66rem;
    font-weight:800;
    letter-spacing:.1em;
    color:var(--amber);
  }

  /* ---------- Cervecería invitada ---------- */
  .band{
    background:var(--hop);
    border-top:4px solid var(--ink);
    border-bottom:4px solid var(--ink);
    padding:12px 18px;
  }
  .band .tag{
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.11em;
    color:#9FE7BE;
  }
  .band .brewer{
    font-family:var(--display);
    font-size:1.7rem;
    line-height:1.05;
    margin-top:2px;
    text-transform:uppercase;
    color:var(--cream);
  }

  /* ---------- Pie ---------- */
  .foot{
    border-top:1px solid rgba(255,255,255,.13);
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:11px;
  }
  .foot a{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text);
    font-size:.92rem;
    font-weight:700;
    text-decoration:none;
  }
  .foot svg{flex:0 0 21px;width:21px;height:21px;color:var(--amber)}
  .foot a:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
  .where{
    margin-top:2px;
    font-size:.78rem;
    color:#7E8EA3;
  }
</style>
</head>

<script>
/* ==========================================================
   PARA ACTUALIZAR EL MENÚ, EDITA SOLO ESTAS DOS LISTAS.
   color = tono aproximado de la cerveza (la barra de la izquierda).
   ========================================================== */
const BARRA = [
  { nombre:"Cosmos",       estilo:"Honey blonde ale",     abv:"5.0", color:"#E8B93F" },
  { nombre:"Tropical",     estilo:"IPA",                  abv:"6.5", color:"#C9701A" },
  { nombre:"Reesa",        estilo:"Peanut butter stout",  abv:"6.0", color:"#3B2113" },
  { nombre:"Pinky Travel", estilo:"Seltzer fresa-sandía", abv:"4.5", color:"#E85D7A" },
  { nombre:"Tropicoqueta", estilo:"Seltzer mango-piña",   abv:"4.5", color:"#F58B1F" }
];

const INVITADA = {
  cerveceria:"Tres Cachoras",
  cervezas:[
    { nombre:"Cenicienta", estilo:"Hazy IPA", abv:"6.3", color:"#EFA94A" }
  ]
};
/* ========================================================== */

const fila = b => `
  <article class="beer">
    <div class="swatch" style="background:${b.color}"></div>
    <div class="info">
      <div class="name">${b.nombre}</div>
      <div class="style">${b.estilo}</div>
    </div>
    <div class="abv"><b>${b.abv}%</b><span>ABV</span></div>
  </article>`;

document.getElementById("barra").innerHTML = BARRA.map(fila).join("");

document.getElementById("invitada").innerHTML =
  (INVITADA && INVITADA.cervezas.length)
    ? `<div class="band">
         <div class="tag">CERVECERÍA INVITADA</div>
         <div class="brewer">${INVITADA.cerveceria}</div>
       </div>` + INVITADA.cervezas.map(fila).join("")
    : "";
</script>
